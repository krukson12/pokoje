<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dworek</title>
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060b16" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  /* Design tokens: direction "B. Recepcja" (design-preview.html). Components use only these. */
  :root {
    color-scheme: light dark;
    --font: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    --t-cap: 12px; --t-small: 14px; --t-body: 16px; --t-title: 20px; --t-num: 22px;
    --r-card: 8px; --r-ctl: 6px; --r-pill: 999px; --tap: 44px;
    --bg: #eef1f5; --surface: #ffffff; --track: #e2e8f0; --ink: #0f172a; --muted: #475569;
    --line: #dbe1e8; --field: #7b8696; --focus: #1d4ed8;
    --primary: #1d4ed8; --on-primary: #ffffff;
    --header-bg: #0f172a; --header-ink: #ffffff; --header-btn: rgba(255,255,255,.12);
    --free-bg: #dcfce7; --free-fg: #166534; --occ-bg: #fee2e2; --occ-fg: #991b1b; --blk-bg: #ede9fe; --blk-fg: #5b21b6;
    --ev-impreza: #92400e; --ev-komunia: #0f766e; --on-ev: #ffffff; --ev-impreza-line: #92400e; --ev-komunia-line: #0f766e;
    --backdrop: rgba(15,23,42,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --surface: #131c2e; --track: #1c2740; --ink: #e5e9f0; --muted: #9aa6b8;
      --line: #24314a; --field: #66748c; --focus: #93b4ff;
      --primary: #93b4ff; --on-primary: #0b1220;
      --header-bg: #060b16; --header-ink: #e5e9f0;
      --free-bg: #0f2e1d; --free-fg: #86efac; --occ-bg: #3b1414; --occ-fg: #fca5a5; --blk-bg: #2a1f4a; --blk-fg: #c4b5fd;
      --ev-impreza-line: #d97706; --ev-komunia-line: #14b8a6;
      --backdrop: rgba(0,0,0,.6);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:var(--t-body)/1.5 var(--font); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  [hidden] { display:none !important; }
  button { font:inherit; cursor:pointer; }
  header { position:sticky; top:0; z-index:2; background:var(--header-bg); color:var(--header-ink); padding:10px 16px calc(10px);
    padding-top:max(10px, env(safe-area-inset-top)); display:flex; gap:8px; align-items:center; }
  header h1 { font-size:var(--t-title); line-height:1.2; margin:0; flex:1; font-weight:600; }
  header button { background:var(--header-btn); color:var(--header-ink); border:0; border-radius:var(--r-ctl); padding:6px 10px; font-size:var(--t-small); font-weight:500; }
  .wrap { max-width:960px; margin:0 auto; padding:12px 16px 40px; }
  #stats { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; margin-bottom:12px; }
  @media (min-width:640px) { #stats { grid-template-columns:repeat(4, minmax(0, 1fr)); } }
  .stat { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:8px 12px; display:flex; align-items:baseline; gap:8px; }
  .stat b { font-size:var(--t-num); line-height:1.2; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stat small { color:var(--muted); font-size:var(--t-small); }
  html { scroll-padding-top:72px; }
  #filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  #filters button { min-height:var(--tap); border:1px solid var(--field); background:var(--surface); color:var(--ink); border-radius:var(--r-pill); padding:6px 12px; white-space:nowrap; font-size:14px; }
  #filters button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  h2 { font-size:var(--t-cap); color:var(--muted); margin:16px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  .tile { text-align:start; border:1px solid var(--line); border-inline-start:5px solid; border-radius:var(--r-card); padding:8px 10px; min-height:72px; display:flex; flex-direction:column; gap:2px; color:var(--ink); }
  .tile.free { background:var(--free-bg); border-inline-start-color:var(--free-fg); }
  .tile.occ { background:var(--occ-bg); border-inline-start-color:var(--occ-fg); }
  .tile.blk { background:var(--blk-bg); border-inline-start-color:var(--blk-fg); }
  .tile:disabled { cursor:default; }
  .tabs { display:flex; background:var(--track); border-radius:calc(var(--r-ctl) + 3px); padding:3px; margin-bottom:12px; }
  .tabs button { flex:1; border:0; background:none; border-radius:var(--r-ctl); padding:8px; font-weight:600; color:var(--muted); }
  .tabs button.on { background:var(--primary); color:var(--on-primary); }
  .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calhead b { font-size:18px; text-transform:capitalize; }
  .calhead button { width:var(--tap); height:var(--tap); border:1px solid var(--field); background:var(--surface); color:var(--ink); border-radius:var(--r-ctl); font-size:20px; }
  #calGrid, #evGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .dow { text-align:center; font-size:var(--t-cap); color:var(--muted); padding:4px 0; }
  .day { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-ctl); min-height:52px; padding:4px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .day span { font-weight:600; font-variant-numeric:tabular-nums; }
  .day small { font-size:var(--t-cap); color:var(--blk-fg); background:var(--blk-bg); border-radius:var(--r-pill); font-weight:600; font-variant-numeric:tabular-nums; padding:0 6px; white-space:nowrap; }
  .day.other, .day.past span { color:var(--muted); } .day.other { background:transparent; }
  .day.today { border-color:var(--ink); } .day.sel { box-shadow:inset 0 0 0 3px var(--primary); }
  .day small.ev { background:var(--ev-impreza); color:var(--on-ev); }
  .ev { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:10px 12px; margin-bottom:8px; border-inline-start:5px solid var(--ev-impreza-line); }
  .ev.komunia { border-inline-start-color:var(--ev-komunia-line); }
  .evh { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .evh .btn { margin-inline-start:auto; padding:4px 10px; font-size:var(--t-small); }
  .badge.impreza { background:var(--ev-impreza); color:var(--on-ev); } .badge.komunia { background:var(--ev-komunia); color:var(--on-ev); }
  .ev dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0; font-size:var(--t-small); }
  .ev dt { color:var(--muted); } .ev dd { margin:0; overflow-wrap:anywhere; }
  #todayEv:empty { display:none; }
  .files { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
  .file { display:inline-flex; align-items:center; gap:2px; background:var(--bg); border-radius:var(--r-ctl); padding:4px 8px; font-size:var(--t-small); max-width:100%; }
  .file a { color:var(--primary); overflow-wrap:anywhere; }
  .ev a { color:var(--primary); }
  .file button { border:0; background:none; font-size:20px; line-height:1; color:var(--muted); min-width:var(--tap); min-height:var(--tap); }
  .up { font-size:var(--t-small); padding:4px 10px; }
  .msg { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-ctl); padding:8px 10px; font-size:var(--t-small); }
  .tile b { font-size:var(--t-body); line-height:1.25; }
  .tile small { color:var(--muted); font-size:var(--t-small); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile .ic { font-size:var(--t-cap); color:var(--muted); margin-top:auto; }
  .empty { color:var(--muted); }
  dialog { border:0; background:var(--surface); color:var(--ink); border-radius:calc(var(--r-card) + 4px); padding:0; width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 32px); }
  dialog::backdrop { background:var(--backdrop); }
  .sheet { padding:16px; }
  .sheet h3 { margin:0 0 4px; font-size:var(--t-title); line-height:1.2; display:flex; align-items:center; gap:8px; }
  .sheet h3 .x { margin-inline-start:auto; border:0; background:var(--bg); color:var(--ink); border-radius:var(--r-ctl); font-size:24px; line-height:1; min-width:var(--tap); min-height:var(--tap); }
  .badge { font-size:var(--t-cap); font-weight:600; padding:2px 8px; border-radius:var(--r-pill); }
  .badge.free { background:var(--free-bg); color:var(--free-fg); } .badge.occ { background:var(--occ-bg); color:var(--occ-fg); } .badge.blk { background:var(--blk-bg); color:var(--blk-fg); }
  .row { margin:12px 0; }
  .f { display:block; font-size:var(--t-small); font-weight:500; color:var(--muted); margin-bottom:4px; }
  label.f > input, label.f > select, label.f > textarea { display:block; margin-top:4px; font-weight:400; }
  .st { display:inline-flex; align-items:center; gap:5px; align-self:flex-start; font-size:var(--t-cap); font-weight:600; line-height:1.4; padding:1px 8px; border-radius:var(--r-pill); background:var(--surface); }
  .st svg { width:13px; height:13px; flex:none; }
  .st.free { color:var(--free-fg); } .st.occ { color:var(--occ-fg); } .st.blk { color:var(--blk-fg); }
  .err { border-color:var(--occ-fg); }
  .err .btn { margin-top:8px; }
  .acts { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-top:16px; }
  #ask { width:min(420px, calc(100vw - 32px)); }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], textarea, select { width:100%; font:inherit; color:var(--ink); padding:8px 10px; min-height:var(--tap); border:1px solid var(--field); border-radius:var(--r-ctl); background:var(--surface); }
  textarea { min-height:60px; resize:vertical; }
  .big { width:100%; border:0; border-radius:var(--r-ctl); padding:12px; min-height:48px; font-weight:600; font-size:var(--t-body); background:var(--primary); color:var(--on-primary); }
  .stepper { display:flex; align-items:center; gap:12px; }
  .stepper button { width:var(--tap); height:var(--tap); border-radius:var(--r-ctl); border:1px solid var(--field); background:var(--surface); color:var(--ink); font-size:20px; }
  .stepper b { font-size:20px; min-width:20px; text-align:center; font-variant-numeric:tabular-nums; }
  .log { list-style:none; padding:0; margin:0; font-size:var(--t-small); }
  .log li { padding:6px 0; border-top:1px solid var(--line); }
  .log small { color:var(--muted); }
  .meta { font-size:var(--t-small); color:var(--muted); }
  .btn { border:1px solid var(--field); background:var(--surface); color:var(--ink); border-radius:var(--r-ctl); padding:8px 12px; min-height:var(--tap); font-weight:500; }
  .btn.pri { background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
  .btn.danger { background:var(--occ-fg); color:var(--surface); border-color:var(--occ-fg); }
  button { -webkit-tap-highlight-color:transparent; }
  @media (hover: hover) { .tile:hover, .btn:hover, .day:hover, #filters button:hover { filter:brightness(.96); } }
  @media (prefers-reduced-motion: no-preference) {
    button { transition:scale 150ms ease-out; }
    button:not(:disabled):active { scale:.96; }
  }
  .staff { list-style:none; margin:12px 0 0; padding:0; font-size:var(--t-small); }
  .staff li { padding:10px 0; border-top:1px solid var(--line); }
  .staff .acts { justify-content:flex-start; margin-top:8px; }
  .staff select { width:auto; min-width:120px; }
  #login { max-width:360px; margin:12vh auto; padding:24px 16px; }
  #login h1, #loginMsg { text-align:center; }
  #pwForm label.f { margin-top:12px; }
  #login .btn { width:100%; margin-top:8px; padding:12px; }
  </style>
</head>
<body>

<div id="login" hidden>
  <h1>Dworek</h1>
  <p class="meta" id="loginMsg" role="status">Zaloguj się, żeby zobaczyć stan pokoi.</p>
  <form id="pwForm" class="row">
    <label class="f">Login<input type="text" id="user" autocomplete="username" autocapitalize="none" required></label>
    <label class="f">Hasło<input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="btn pri">Zaloguj</button>
  </form>
  <button class="btn" id="google">Zaloguj przez Google</button>
  <button class="btn" id="logout2" hidden>Wyloguj</button>
</div>

<div id="app" hidden>
  <header>
    <h1>Dworek</h1>
    <button id="histBtn">Historia</button>
    <button id="teamBtn">Zespół</button>
    <button id="logout">Wyloguj</button>
  </header>
  <div class="wrap">
    <nav class="tabs" id="tabs" aria-label="Widok"><button data-v="today" class="on" aria-pressed="true">Dziś</button><button data-v="cal" aria-pressed="false">Kalendarz</button><button data-v="ev" aria-pressed="false">Imprezy</button></nav>
    <div class="msg err" id="netErr" role="alert" hidden><b>Nie udało się wczytać danych.</b> <span id="netErrText"></span><br><button class="btn" id="retry">Spróbuj ponownie</button></div>
    <div id="todayView">
      <p class="msg" id="todayEv"></p>
      <div id="stats"></div>
      <div id="filters" role="group" aria-label="Pokaż pokoje">
        <button data-f="all" class="on" aria-pressed="true">Wszystkie</button>
        <button data-f="free" aria-pressed="false">Wolne</button>
        <button data-f="blk" aria-pressed="false">Zablokowane</button>
        <button data-f="occ" aria-pressed="false">Zajęte</button>
      </div>
      <div id="board"><p class="meta" role="status">Wczytuję pokoje…</p></div>
    </div>
    <div id="calView" hidden>
      <div class="calhead"><button id="prevM" aria-label="Poprzedni miesiąc">‹</button><b id="monthName"></b><button id="nextM" aria-label="Następny miesiąc">›</button></div>
      <div id="calGrid"></div>
      <h2 id="dayName"></h2>
      <p class="meta" id="dayInfo"></p>
      <p class="msg" id="calMsg" hidden></p>
      <div id="calTools" hidden>
        <div class="row"><button class="btn pri" id="bulkBtn">Zablokuj kilka pokoi w hotelu</button></div>
        <div class="row"><label class="f">Opis nowych blokad<input type="text" id="blkNote" placeholder="np. wesele Kowalskich"></label></div>
      </div>
      <div id="dayRooms"></div>
    </div>
    <div id="evView" hidden>
      <div class="calhead"><button id="evPrev" aria-label="Poprzedni miesiąc">‹</button><b id="evMonth"></b><button id="evNext" aria-label="Następny miesiąc">›</button></div>
      <div id="evGrid"></div>
      <h2 id="evDayName"></h2>
      <div class="row" id="evTools" hidden><button class="btn pri" id="evAdd">Dodaj imprezę</button></div>
      <div id="evList"></div>
    </div>
    <p class="meta" id="who"></p>
  </div>
</div>

<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<dialog id="ask" aria-labelledby="askT"></dialog>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

// Same Supabase project as FitDash/Stampd (Google login is set up there).
const sb = createClient('https://wkzaebbfhytuauioqjqw.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndremFlYmJmaHl0dWF1aW9xanF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTY2NzgsImV4cCI6MjA5NTU3MjY3OH0.DyrWDmxKqFFhr_geNapCJMlhb2lrpVhCYEQvvGzGjMw');

const BUILDINGS = [['dworek', 'Dworek'], ['hotel', 'Hotel']];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const when = t => new Date(t).toLocaleString('pl-PL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
const dlg = $('#dlg');

let role = null, me = '', rooms = [], staff = [], settings = {}, filter = 'all', openId = null, openBlk = null;
// Calendar: days are local YYYY-MM-DD strings; the venue and its staff are in Poland.
const iso = d => d.toLocaleDateString('sv-SE');
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const plDay = s => new Date(s + 'T12:00').toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
const shortDay = s => s.slice(8) + '.' + s.slice(5, 7);
let view = 'today', month = todayISO().slice(0, 7), day = todayISO(), blocks = [];
const blockOf = (id, d) => blocks.find(b => b.room_id === id && b.day === d);
// Column names exactly as in the Excel sheets "2026" and "Komunie 2026".
const EVENT_COLS = {
  impreza: ['Jaka uroczystość', 'Nazwisko', 'tel', 'liczba osób', 'czy zadatek', 'czy jest umowa podpisana', 'inne'],
  komunia: ['nazwisko', 'tel', 'liczba osób', 'czy kolacja', 'czy umowa', 'zadatek', 'inne'],
};
const KIND = { impreza: 'Impreza', komunia: 'Komunia' };
let events = [], files = [];
const FILE_TYPES = {
  pdf: 'application/pdf', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  jpg: 'image/jpeg', jpeg: 'image/jpeg', heic: 'image/heic',
};
const eventsOn = d => events.filter(e => e.day === d);
const canEdit = () => role === 'edit' || role === 'admin';
const isAdmin = () => role === 'admin';
const ROLE_TXT = { admin: 'admin', edit: 'edycja', view: 'podgląd' };
// Admins can hand out admin; others only edit/view.
const roleOptions = sel => Object.entries(ROLE_TXT).filter(([k]) => k !== 'admin' || isAdmin())
  .map(([k, l]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${l}</option>`).join('');
// Login accounts live in auth as <login>@pokoje.local (see supabase/functions/pokoje-staff).
const LOCAL = '@pokoje.local';
const isLocal = email => email.endsWith(LOCAL);
const shortEmail = email => isLocal(email) ? 'login: ' + email.slice(0, -LOCAL.length) : email;
const who = email => staff.find(s => s.email === email)?.name || (email ? shortEmail(email) : '?');
// A room blocked in the calendar for today is not free to sell, even if nobody took it yet.
// Polish plural: plural(1, 'pokój', 'pokoje', 'pokoi') → "1 pokój", 2 → "2 pokoje", 5 → "5 pokoi".
const plural = (n, one, few, many) => `${n} ${{ one, few }[new Intl.PluralRules('pl').select(n)] ?? many}`;
const STATE_ICON = {
  free: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  occ: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="currentColor"/><path d="M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5z" fill="currentColor"/></svg>',
  blk: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
};
// State as a word and an icon, never by colour alone.
const stateChip = s => `<span class="st ${s}">${STATE_ICON[s]}${STATE_TXT[s]}</span>`;

// One small dialog for questions, errors and confirmations; it stacks over an open sheet.
// Resolves true/false, or the typed value/null when `field` is given.
function ask({ title, body = '', ok = 'Zamknij', cancel = '', danger = false, field = null }) {
  const d = $('#ask');
  d.innerHTML = `<form method="dialog" class="sheet"><h3 id="askT">${esc(title)}</h3>
    ${body ? `<p style="white-space:pre-line;margin:8px 0 0">${esc(body)}</p>` : ''}
    ${field ? `<label class="f" style="margin-top:12px">${esc(field.label)}<input name="v" type="${field.type || 'text'}" autocomplete="${field.autocomplete || 'off'}" minlength="${field.min || 0}" required></label>` : ''}
    <div class="acts">${cancel ? `<button class="btn" value="no" formnovalidate>${esc(cancel)}</button>` : ''}<button class="btn ${danger ? 'danger' : 'pri'}" value="yes">${esc(ok)}</button></div></form>`;
  return new Promise(res => {
    const done = yes => res(yes ? (field ? d.querySelector('[name=v]').value : true) : (field ? null : false));
    // Answer from the clicked button itself; 'close' only covers Escape (some webviews never fire it).
    d.querySelector('form').onsubmit = e => { e.preventDefault(); d.close(); done(e.submitter?.value === 'yes'); };
    d.onclose = () => done(false);
    d.showModal();
  });
}
// Plain-language error with the next step; the server's own text stays as a detail.
const errHint = e => /fetch|network|load failed/i.test(e?.message || '') ? 'Brak połączenia z internetem. Sprawdź połączenie i spróbuj ponownie.'
  : 'Spróbuj ponownie za chwilę. Jeśli błąd się powtarza, napisz do administratora.';
const fail = (title, e) => ask({ title, body: errHint(e) + (e?.message ? `\n\nSzczegóły: ${e.message}` : '') });
function netError(e) { $('#netErr').hidden = !e; if (e) $('#netErrText').textContent = errHint(e); }

const state = r => r.occupied ? 'occ' : blockOf(r.id, todayISO()) ? 'blk' : 'free';
const STATE_TXT = { free: 'Wolny', blk: 'Zablokowany', occ: 'Zajęty' };

// ── Auth ──
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  me = session.user.email.toLowerCase();
  const { data } = await sb.rpc('pokoje_role');
  role = data;
  if (!role) return showLogin(`Konto ${me} nie ma dostępu. Poproś kierownika o dodanie tego adresu w zakładce Zespół.`, true);
  $('#login').hidden = true;
  $('#app').hidden = false;
  $("#who").textContent = `Zalogowano jako ${isLocal(me) ? me.slice(0, -LOCAL.length) : me} (uprawnienia: ${ROLE_TXT[role]})`;
  // History is for admins, the team list for anyone who can edit.
  $('#histBtn').hidden = !isAdmin();
  $('#teamBtn').hidden = !canEdit();
  await load();
  sb.channel('pokoje')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pokoje_rooms' }, p => put(p.new))
    // pokoje_blocks itself isn't broadcast (see supabase.sql); a counter on settings says "reload".
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pokoje_settings' }, p => { settings = p.new; loadBlocks(); })
    .subscribe();
  // Phones drop the websocket when asleep, so re-read on wake.
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && load());
}

function showLogin(msg, signedIn) {
  $('#app').hidden = true;
  $('#login').hidden = false;
  if (msg) $('#loginMsg').textContent = msg;
  $('#google').hidden = $('#pwForm').hidden = !!signedIn;
  $('#logout2').hidden = !signedIn;
}

$('#google').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
$('#pwForm').onsubmit = async e => {
  e.preventDefault();
  const u = $("#user").value.trim().toLowerCase();
  if (u.includes('@') && !u.endsWith(LOCAL)) return void ($('#loginMsg').textContent = 'Z adresem Gmail zaloguj się przyciskiem „Zaloguj przez Google” poniżej.');
  const { error } = await sb.auth.signInWithPassword({ email: $("#user").value.trim().toLowerCase().replace(LOCAL, '') + LOCAL, password: $('#pw').value });
  if (error) $('#loginMsg').textContent = /invalid/i.test(error.message) ? 'Zły login albo hasło.' : 'Nie zalogowano: ' + error.message;
};
// Local sign-out: a global one fails on an already-ended session (e.g. after a password reset)
// and then left the phone signed in.
$('#logout').onclick = $('#logout2').onclick = async () => {
  await Promise.race([sb.auth.signOut({ scope: 'local' }).catch(() => {}), new Promise(r => setTimeout(r, 2000))]);
  Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k));
  location.reload();
};
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !role) start(); });

// ── Data ──
async function load() {
  const [r, s, st] = await Promise.all([
    sb.from('pokoje_rooms').select('*').order('sort'),
    sb.from('pokoje_staff').select('*').order('name'),
    sb.from('pokoje_settings').select('*').maybeSingle(),
  ]);
  if (r.error) return netError(r.error);
  rooms = r.data; staff = s.data || []; settings = st.data || {};
  await loadBlocks();
}

// Six weeks shown in the calendar, Monday first.
function gridDays() {
  const first = month + '-01', start = addDays(first, -((new Date(first + 'T12:00').getDay() + 6) % 7));
  return Array.from({ length: 42 }, (_, i) => addDays(start, i));
}

// Blocks for the visible weeks plus today (the board shows today's blocks).
// Events too, for the same range.
let loadSeq = 0;
async function loadBlocks() {
  // Paging months quickly fires several loads; only the latest one may land.
  const seq = ++loadSeq;
  const g = gridDays(), t = todayISO(), from = g[0] < t ? g[0] : t, to = g[41] > t ? g[41] : t;
  const [b, ev] = await Promise.all([
    sb.from('pokoje_blocks').select('*').gte('day', from).lte('day', to),
    sb.from('pokoje_events').select('*').gte('day', from).lte('day', to).order('day').order('kind').order('sort').order('id'),
  ]);
  if (seq !== loadSeq) return;
  if (b.error || ev.error) return netError(b.error || ev.error);
  netError(null);
  const f = ev.data.length ? await sb.from('pokoje_files').select('*').in('event_id', ev.data.map(e => e.id)).order('at') : { data: [] };
  if (seq !== loadSeq) return;
  blocks = b.data; events = ev.data; files = f.data || [];
  render();
}

function put(row) {
  const i = rooms.findIndex(r => r.id === row.id);
  if (i >= 0) rooms[i] = row;
  render();
}

// guardFree: only succeed if nobody took the room in the meantime.
async function save(id, patch, guardFree) {
  let q = sb.from('pokoje_rooms').update(patch).eq('id', id);
  if (guardFree) q = q.eq('occupied', false);
  const { data, error } = await q.select();
  if (error) return fail('Nie zapisano zmiany', error);
  if (!data.length) {
    ask(guardFree ? { title: 'Pokój jest już zajęty', body: 'Ktoś przed chwilą zajął ten pokój. Stan został odświeżony.' }
      : { title: 'Nie zapisano zmiany', body: 'Możliwe, że nie masz już uprawnień do edycji. Wyloguj się i zaloguj ponownie.' });
    return load();
  }
  put(data[0]);
}

// ── Board ──
function render() {
  const n = s => rooms.filter(r => state(r) === s).length;
  const beds = rooms.reduce((a, r) => a + r.extra_beds, 0);
  $('#stats').innerHTML = [
    [n('free'), 'wolne'], [n('blk'), 'zablokowane'], [n('occ'), 'zajęte'],
    [`${beds} / ${settings.extra_beds_total ?? '?'}`, 'dostawki w użyciu'],
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');

  const show = r => filter === 'all' || state(r) === filter;
  $('#board').innerHTML = BUILDINGS.map(([b, label]) => {
    const list = rooms.filter(r => r.building === b && show(r));
    return `<h2>${label}</h2>` + (list.length ? `<div class="grid">${list.map(tile).join('')}</div>` : '<p class="empty">Brak pokoi w tym widoku.</p>');
  }).join('');
  const te = eventsOn(todayISO());
  $('#todayEv').textContent = te.length ? 'Dziś: ' + te.map(evTitle).join(', ') : '';
  if (view === 'cal') renderCal();
  if (view === 'ev') renderEv();
  // A draft (room not blocked yet) lives only in the sheet; redraw only saved blocks.
  if (openBlk && dlg.open && blockOf(openBlk, day)) blockSheet(openBlk);
  if (openId && dlg.open) roomSheet(openId);
}

function tile(r) {
  const s = state(r);
  const k = blockOf(r.id, todayISO());
  const ic = [r.extra_beds ? `🛏+${r.extra_beds}` : '', r.note ? '📝' : '', k && r.occupied ? '📅' : ''].join(' ');
  const text = r.occupied ? r.guest : k ? k.note : '';
  return `<button class="tile ${s}" data-id="${r.id}"><b>${esc(r.name)}</b>${stateChip(s)}${text ? `<small>${esc(text)}</small>` : ''}<span class="ic">${ic}</span></button>`;
}

$('#board').onclick = e => { const t = e.target.closest('.tile'); if (t) { openBlk = null; openId = t.dataset.id; roomSheet(openId); dlg.showModal(); } };
$('#filters').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  $('#filters').querySelectorAll('button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
  render();
};
// 'close' fires late: if another sheet was opened meanwhile, keep its state.
dlg.onclose = () => { if (!dlg.open) openId = openBlk = null; };
dlg.onclick = e => { if (e.target === dlg || e.target.closest('.x')) dlg.close(); };

// ── Calendar ──
function renderCal() {
  const t = todayISO(), counts = {};
  blocks.forEach(b => { counts[b.day] = (counts[b.day] || 0) + 1; });
  $('#monthName').textContent = monthTitle();
  $('#calGrid').innerHTML = gridHtml(counts, '', ['blokada', 'blokady', 'blokad']);
  const ed = canEdit() && day >= t;
  $('#dayName').textContent = plDay(day);
  $('#dayInfo').textContent = `Zablokowane: ${counts[day] || 0} z ${rooms.length}. ` +
    (ed ? 'Dotknij pokoju, żeby go zablokować, odblokować albo dopisać gościa.' : day < t ? 'Ten dzień minął, tylko podgląd.' : '');
  $('#calTools').hidden = !ed;
  $('#dayRooms').innerHTML = BUILDINGS.map(([b, label]) => `<h2>${label}</h2><div class="grid">${rooms.filter(r => r.building === b).map(r => {
    const k = blockOf(r.id, day);
    const ic = k ? [k.extra_beds ? `🛏+${k.extra_beds}` : '', k.details ? '📝' : '', isAdmin() ? esc(who(k.by)) : ''].join(' ') : '';
    return `<button class="tile ${k ? 'blk' : 'free'}" data-blk="${r.id}"><b>${esc(r.name)}</b>${stateChip(k ? 'blk' : 'free')}
      ${k?.note ? `<small>${esc(k.note)}</small>` : ''}<span class="ic meta">${ic}</span></button>`;
  }).join('')}</div>`).join('');
}

// Month grid shared by both calendars; counts = {day: number shown on the day}.
// counts = {day: number}; noun = [one, few, many] for that number, e.g. blokada / blokady / blokad.
function gridHtml(counts, cls, noun) {
  const t = todayISO();
  const name = d => new Date(d + 'T12:00').toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' }) +
    (counts[d] ? ', ' + plural(counts[d], ...noun) : '');
  return ['pn', 'wt', 'śr', 'cz', 'pt', 'so', 'nd'].map(d => `<span class="dow" aria-hidden="true">${d}</span>`).join('') +
    gridDays().map(d => `<button class="day${d.slice(0, 7) !== month ? ' other' : ''}${d < t ? ' past' : ''}${d === t ? ' today' : ''}${d === day ? ' sel' : ''}" data-day="${d}"
      aria-label="${name(d)}" aria-pressed="${d === day}"${d === t ? ' aria-current="date"' : ''}>
      <span>${+d.slice(8)}</span>${counts[d] ? `<small class="${cls}">${counts[d]}</small>` : ''}</button>`).join('');
}
const monthTitle = () => { const [y, m] = month.split('-').map(Number); return new Date(y, m - 1, 15).toLocaleDateString('pl-PL', { month: 'long', year: 'numeric' }); };

function calMsg(text) { $('#calMsg').hidden = !text; $('#calMsg').textContent = text; }

$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.v;
  $('#tabs').querySelectorAll('button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
  $('#todayView').hidden = view !== 'today';
  $('#calView').hidden = view !== 'cal';
  $('#evView').hidden = view !== 'ev';
  render();
};
const shiftMonth = n => {
  const [y, m] = month.split('-').map(Number);
  month = iso(new Date(y, m - 1 + n, 15)).slice(0, 7);
  day = month === todayISO().slice(0, 7) ? todayISO() : month + '-01';
  calMsg('');
  loadBlocks();
};
$('#prevM').onclick = () => shiftMonth(-1);
$('#nextM').onclick = () => shiftMonth(1);
$('#calGrid').onclick = $('#evGrid').onclick = e => {
  const b = e.target.closest('[data-day]'); if (!b) return;
  day = b.dataset.day;
  calMsg('');
  if (day.slice(0, 7) !== month) { month = day.slice(0, 7); return loadBlocks(); }
  render();
};
$('#evPrev').onclick = () => shiftMonth(-1);
$('#evNext').onclick = () => shiftMonth(1);
$('#dayRooms').onclick = e => {
  const b = e.target.closest('[data-blk]'); if (!b) return;
  openId = null; openBlk = b.dataset.blk;
  blockSheet(openBlk);
  dlg.showModal();
};

// Guest, extra beds and notes: the same fields on the room sheet ("Dziś") and the block sheet
// (calendar). Each arg is [attribute, value]; beds may add a third, extra attribute.
const guestFields = (dis, [gAttr, guest], [bAttr, beds, bExtra = ''], [nAttr, notes]) => `
    <div class="row"><label class="f">Gość / wesele<input type="text" ${gAttr} value="${esc(guest)}" ${dis} placeholder="np. wesele Kowalskich, p. Nowak"></label></div>
    <div class="row" role="group" aria-labelledby="bedsL"><span class="f" id="bedsL">Łóżka dostawkowe</span><div class="stepper">
      <button ${bAttr}="-1" ${dis} aria-label="Mniej dostawek">−</button><b ${bExtra} aria-live="polite">${beds}</b><button ${bAttr}="1" ${dis} aria-label="Więcej dostawek">+</button></div></div>
    <div class="row"><label class="f">Notatka<textarea ${nAttr} ${dis} placeholder="np. łóżeczko dla dziecka, późny przyjazd">${esc(notes)}</textarea></label></div>`;

// Same fields as the room sheet on "Dziś", for the day picked in the calendar.
// Not blocked yet: the fields are a draft saved by "Zablokuj". Blocked: each change saves.
function blockSheet(id) {
  if (dlg.contains(document.activeElement) && document.activeElement.matches('input[type=text],textarea')) return;
  const r = rooms.find(x => x.id === id), k = blockOf(id, day), ed = canEdit() && day >= todayISO(), dis = ed ? '' : 'disabled';
  const v = k || { note: $('#blkNote').value.trim(), extra_beds: 0, details: '' };
  $('#dlgBody').innerHTML = `
    <h3>${esc(r.name)} <span class="badge ${k ? 'blk' : 'free'}">${k ? 'Zablokowany' : 'Wolny'}</span><button class="x" aria-label="Zamknij">×</button></h3>
    <div class="meta">${plDay(day)}${k && isAdmin() ? ` · zablokował(a): ${esc(who(k.by))}, ${when(k.at)}` : ''}</div>
    ${day === todayISO() && r.occupied ? `<p class="msg">Pokój jest teraz zajęty${r.guest ? ': ' + esc(r.guest) : ''}.</p>` : ''}
    ${ed ? `<div class="row">${k ? '<button class="big free" data-bact="free">Odblokuj pokój</button>' : '<button class="big blk" data-bact="block">Zablokuj pokój</button>'}</div>` : ''}
    ${guestFields(dis, ['data-b="note"', v.note], ['data-bbeds', v.extra_beds, 'id="bBeds"'], ['data-b="details"', v.details])}`;
}

async function saveBlock(id, patch) {
  const { data, error } = await sb.from('pokoje_blocks').update(patch).eq('room_id', id).eq('day', day).select();
  if (error) fail('Nie zapisano blokady', error);
  else if (!data.length) ask({ title: 'Nie zapisano blokady', body: 'Ktoś mógł ją przed chwilą usunąć. Kalendarz został odświeżony.' });
  loadBlocks();
}
$('#dlgBody').addEventListener('click', async e => {
  if (!openBlk) return;
  const id = openBlk, k = blockOf(id, day), act = e.target.dataset.bact, step = e.target.dataset.bbeds;
  if (step) {
    const v = +$('#bBeds').textContent + +step;
    if (v < 0 || v > 3) return;
    if (k) return saveBlock(id, { extra_beds: v });
    $('#bBeds').textContent = v;
  }
  if (act === 'block') {
    const r = rooms.find(x => x.id === id);
    if (day === todayISO() && r.occupied && !await ask({ title: `Zablokować ${r.name}?`, body: `Pokój jest teraz zajęty${r.guest ? ' (' + r.guest + ')' : ''}.`, ok: 'Zablokuj mimo to', cancel: 'Anuluj' })) return;
    const { error } = await sb.from('pokoje_blocks').insert({ room_id: id, day,
      note: $('[data-b=note]').value.trim(), details: $('[data-b=details]').value.trim(), extra_beds: +$('#bBeds').textContent });
    if (error) error.code === '23505' ? ask({ title: 'Pokój jest już zablokowany', body: 'Ktoś przed chwilą go zablokował. Kalendarz został odświeżony.' }) : fail('Nie zablokowano pokoju', error);
    loadBlocks();
  }
  if (act === 'free') {
    const { error } = await sb.from('pokoje_blocks').delete().eq('room_id', id).eq('day', day);
    if (error) fail('Nie odblokowano pokoju', error);
    await loadBlocks();
    if (openBlk === id) blockSheet(id);
  }
});
$('#dlgBody').addEventListener('change', e => {
  const f = e.target.dataset.b;
  if (openBlk && f && blockOf(openBlk, day)) saveBlock(openBlk, { [f]: e.target.value.trim() });
});

$('#bulkBtn').onclick = () => {
  openId = openBlk = null;
  const t = todayISO();
  $('#dlgBody').innerHTML = `<h3>Zablokuj pokoje w hotelu<button class="x" aria-label="Zamknij">×</button></h3>
    <p class="meta">Blokujemy pierwsze wolne pokoje według numerów. Na przykład 10 pokoi to Hotel 1 do 10, a jeśli któryś jest już zajęty, bierzemy kolejny.</p>
    <form id="bulkForm">
      <div class="row"><label class="f">Od dnia<input type="date" name="from" min="${t}" value="${day}" required></label></div>
      <div class="row"><label class="f">Do dnia (włącznie)<input type="date" name="to" min="${t}" value="${day}" required></label></div>
      <div class="row"><label class="f">Ile pokoi<input type="number" name="count" inputmode="numeric" min="1" max="${rooms.filter(r => r.building === 'hotel').length}" required></label></div>
      <div class="row"><label class="f">Opis<input type="text" name="note" value="${esc($('#blkNote').value)}" placeholder="np. wesele Kowalskich"></label></div>
      <button class="btn pri">Zablokuj</button>
    </form>`;
  dlg.showModal();
};
$('#dlgBody').addEventListener('submit', async e => {
  if (e.target.id !== 'bulkForm') return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const { data, error } = await sb.rpc('pokoje_block_hotel', { p_from: f.from, p_to: f.to, p_count: +f.count, p_note: f.note });
  // P0001 = our own check in pokoje_block_hotel, already in plain Polish.
  if (error) return error.code === 'P0001' ? ask({ title: 'Nie zablokowano pokoi', body: error.message }) : fail('Nie zablokowano pokoi', error);
  dlg.close();
  calMsg(`Zablokowano ${plural(data.length, 'pokój', 'pokoje', 'pokoi')} (${f.from === f.to ? shortDay(f.from) : shortDay(f.from) + ' do ' + shortDay(f.to)}): ${data.join(', ')}.`);
  loadBlocks();
});

// ── Events ──
const evTitle = e => e.data['Jaka uroczystość'] || e.data.nazwisko || e.data.Nazwisko || KIND[e.kind];
const telLinks = v => esc(v).split(/([;,]\s*)/).map(p => /\d{6,}/.test(p.replace(/\s/g, '')) ? `<a href="tel:${p.replace(/[^\d+]/g, '')}">${p}</a>` : p).join('');

function renderEv() {
  const counts = {};
  events.forEach(e => { counts[e.day] = (counts[e.day] || 0) + 1; });
  $('#evMonth').textContent = monthTitle();
  $('#evGrid').innerHTML = gridHtml(counts, 'ev', ['impreza', 'imprezy', 'imprez']);
  $('#evDayName').textContent = plDay(day);
  $('#evTools').hidden = !canEdit();
  const list = eventsOn(day);
  $('#evList').innerHTML = list.length ? list.map(e => `<div class="ev ${e.kind}">
    <div class="evh"><b>${esc(evTitle(e))}</b><span class="badge ${e.kind}">${KIND[e.kind]}</span>${canEdit() ? `<button class="btn" data-ev="${e.id}">Edytuj</button>` : ''}</div>
    <dl>${EVENT_COLS[e.kind].filter(c => e.data[c]).map(c => `<dt>${esc(c)}</dt><dd>${c === 'tel' ? telLinks(e.data[c]) : esc(e.data[c])}</dd>`).join('')}</dl>
    <div class="files">${files.filter(f => f.event_id === e.id).map(f => `<span class="file"><a href="#" data-file="${f.id}">📎 ${esc(f.name)}</a>${canEdit() ? `<button data-delfile="${f.id}" aria-label="Usuń plik">×</button>` : ''}</span>`).join('')}
      ${canEdit() ? `<label class="btn up">Dodaj plik (PDF, DOCX, JPG, HEIC)<input type="file" data-up="${e.id}" accept="${Object.keys(FILE_TYPES).map(x => '.' + x)},${[...new Set(Object.values(FILE_TYPES))]}" multiple hidden></label>` : ''}</div></div>`).join('')
    : '<p class="empty">Brak imprez tego dnia.</p>';
}

const evFields = (kind, data) => EVENT_COLS[kind].map(c => `<div class="row"><label class="f">${esc(c)}${c === 'inne'
  ? `<textarea data-col="${esc(c)}">${esc(data[c])}</textarea>` : `<input type="text" data-col="${esc(c)}" value="${esc(data[c])}">`}</label></div>`).join('');
const evValues = () => Object.fromEntries([...document.querySelectorAll('#evForm [data-col]')].map(x => [x.dataset.col, x.value.trim()]).filter(([, v]) => v));

function evSheet(e) {
  openId = openBlk = null;
  const kind = e?.kind || 'impreza';
  $('#dlgBody').innerHTML = `<h3>${e ? 'Edytuj imprezę' : 'Nowa impreza'}<button class="x" aria-label="Zamknij">×</button></h3>
    <form id="evForm" data-id="${e?.id || ''}">
      <div class="row" style="display:flex;gap:8px">
        <div style="flex:1;min-width:0"><label class="f">Data<input type="date" name="day" value="${e?.day || day}" required></label></div>
        <div style="flex:1;min-width:0"><label class="f">Rodzaj<select name="kind">${Object.entries(KIND).map(([k, l]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
      </div>
      <div id="evFields">${evFields(kind, e?.data || {})}</div>
      <div style="display:flex;gap:8px"><button class="btn pri">Zapisz</button>${e ? '<button type="button" class="btn" id="evDel">Usuń</button>' : ''}</div>
    </form>`;
  dlg.showModal();
}

$('#evAdd').onclick = () => evSheet(null);
$('#evList').onclick = e => { const b = e.target.closest('[data-ev]'); if (b) evSheet(events.find(x => x.id === +b.dataset.ev)); };
$('#dlgBody').addEventListener('change', e => {
  // Switching kind keeps whatever both column sets share (tel, liczba osób, inne).
  if (e.target.name === 'kind' && e.target.closest('#evForm')) $('#evFields').innerHTML = evFields(e.target.value, evValues());
});
$('#dlgBody').addEventListener('submit', async e => {
  if (e.target.id !== 'evForm') return;
  e.preventDefault();
  const f = e.target, data = evValues(), id = +f.dataset.id;
  if (!Object.keys(data).length) return ask({ title: 'Impreza jest pusta', body: 'Wypełnij przynajmniej jedno pole, na przykład rodzaj uroczystości albo nazwisko.' });
  const row = { day: f.day.value, kind: f.kind.value, data };
  const { error } = id ? await sb.from('pokoje_events').update(row).eq('id', id) : await sb.from('pokoje_events').insert({ ...row, sort: 100000 });
  if (error) return fail('Nie zapisano imprezy', error);
  dlg.close();
  day = row.day; month = day.slice(0, 7);
  loadBlocks();
});
$('#dlgBody').addEventListener('click', async e => {
  if (e.target.id !== 'evDel') return;
  const id = +$('#evForm').dataset.id;
  const own = files.filter(f => f.event_id === id);
  const ev = events.find(x => x.id === id);
  if (!await ask({ title: `Usunąć imprezę „${evTitle(ev)}”?`, danger: true, ok: 'Usuń imprezę', cancel: 'Anuluj',
    body: (own.length ? `Razem z nią znikną załączniki: ${plural(own.length, 'plik', 'pliki', 'plików')}. ` : '') + 'Tego nie da się cofnąć.' })) return;
  // Row first (its file rows go with it); if the storage step fails only an unseen object is left.
  const { error } = await sb.from('pokoje_events').delete().eq('id', id);
  if (error) return fail('Nie usunięto imprezy', error);
  if (own.length) await sb.storage.from('pokoje-files').remove(own.map(f => f.path));
  dlg.close();
  loadBlocks();
});

// ── Attachments ──
$('#evList').addEventListener('click', async e => {
  const open = e.target.closest('[data-file]'), del = e.target.closest('[data-delfile]');
  if (open) {
    e.preventDefault();
    const f = files.find(x => x.id === +open.dataset.file);
    const { data, error } = await sb.storage.from('pokoje-files').createSignedUrl(f.path, 60, { download: f.name });
    if (error) return fail('Nie udało się pobrać pliku', error);
    location.href = data.signedUrl;
  }
  if (del) {
    const f = files.find(x => x.id === +del.dataset.delfile);
    if (!await ask({ title: `Usunąć plik „${f.name}”?`, body: 'Tego nie da się cofnąć.', danger: true, ok: 'Usuń plik', cancel: 'Anuluj' })) return;
    const { error } = await sb.from('pokoje_files').delete().eq('id', f.id);
    if (error) return fail('Nie usunięto pliku', error);
    await sb.storage.from('pokoje-files').remove([f.path]);
    loadBlocks();
  }
});
$('#evList').addEventListener('change', async e => {
  const input = e.target.closest('[data-up]'); if (!input) return;
  const label = input.parentElement, eventId = +input.dataset.up, problems = [];
  label.firstChild.textContent = 'Wysyłam…';
  for (const file of input.files) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!FILE_TYPES[ext]) { problems.push(`${file.name}: tylko PDF, DOCX, JPG albo HEIC`); continue; }
    if (file.size > 20 * 1024 * 1024) { problems.push(`${file.name}: większy niż 20 MB`); continue; }
    const path = `${eventId}/${crypto.randomUUID()}.${ext}`;
    // Re-typed copy: some phones send DOCX/HEIC with no type, and the upload uses the file's own type.
    const up = await sb.storage.from('pokoje-files').upload(path, file.slice(0, file.size, FILE_TYPES[ext]), { contentType: FILE_TYPES[ext] });
    if (up.error) { problems.push(`${file.name}: ${up.error.message}`); continue; }
    const row = await sb.from('pokoje_files').insert({ event_id: eventId, name: file.name, path, size: file.size });
    if (row.error) { await sb.storage.from('pokoje-files').remove([path]); problems.push(`${file.name}: ${row.error.message}`); }
  }
  if (problems.length) ask({ title: problems.length === input.files.length ? 'Nie dodano plików' : 'Nie dodano części plików', body: problems.join('\n') });
  loadBlocks();
});

// ── Room sheet ──
async function roomSheet(id) {
  const r = rooms.find(x => x.id === id), s = state(r), dis = canEdit() ? '' : 'disabled';
  // Don't clobber a field someone is typing in when a live update arrives.
  if (dlg.open && dlg.contains(document.activeElement) && document.activeElement.matches('input[type=text],textarea')) return;
  $('#dlgBody').innerHTML = `
    <h3>${esc(r.name)} <span class="badge ${s}">${STATE_TXT[s]}</span><button class="x" aria-label="Zamknij">×</button></h3>
    <div class="meta">${r.updated_by && isAdmin() ? `Ostatnia zmiana: ${esc(who(r.updated_by))}, ${when(r.updated_at)}` : ''}</div>
    ${(k => k ? `<p class="msg">📅 Zablokowany na dziś${k.note ? ': ' + esc(k.note) : ''}${k.extra_beds ? `, dostawki: ${k.extra_beds}` : ''}${k.details ? `<br>${esc(k.details)}` : ''}</p>` : '')(blockOf(r.id, todayISO()))}
    ${canEdit() ? `<div class="row">${r.occupied
      ? '<button class="big free" data-act="free">Zwolnij pokój</button>'
      : '<button class="big take" data-act="take">Zajmij pokój</button>'}</div>` : ''}
    ${guestFields(dis, ['data-f="guest"', r.guest], ['data-beds', r.extra_beds], ['data-f="note"', r.note])}
    ${canEdit() ? `<div class="row"><label class="f">Nazwa pokoju<input type="text" data-f="name" value="${esc(r.name)}"></label></div>` : ''}
    ${isAdmin() ? '<div class="row"><label class="f">Historia pokoju</label><ul class="log" id="roomLog"><li class="meta">Wczytuję…</li></ul></div>' : ''}`;
  if (!isAdmin()) return;
  const { data } = await sb.from('pokoje_log').select('*').eq('room_id', id).order('at', { ascending: false }).limit(15);
  const el = $('#roomLog');
  if (el) el.innerHTML = logItems(data, false);
}

$('#dlgBody').addEventListener('click', e => {
  const r = rooms.find(x => x.id === openId); if (!r) return;
  const act = e.target.dataset.act, beds = e.target.dataset.beds;
  const k = blockOf(r.id, todayISO());
  if (act === 'take') (async () => {
    if (!k || await ask({ title: `Zająć ${r.name}?`, body: `Pokój jest zablokowany na dziś${k.note ? ' (' + k.note + ')' : ''}.`, ok: 'Zajmij mimo to', cancel: 'Anuluj' }))
      save(r.id, { occupied: true }, true);
  })();
  if (act === 'free') save(r.id, { occupied: false, guest: '', extra_beds: 0 });
  if (beds) {
    const v = r.extra_beds + +beds;
    if (v >= 0 && v <= 3) save(r.id, { extra_beds: v });
  }
});
$('#dlgBody').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f && !t.closest('#teamForm')) save(openId, { [t.dataset.f]: t.value.trim() });
});

// ── Log ──
const FIELDS = {
  occupied: v => v ? 'zajęty' : 'zwolniony',
  guest: v => `gość: ${v || 'brak'}`,
  extra_beds: v => `dostawki: ${v}`,
  note: v => `notatka: ${v || 'usunięta'}`,
  name: v => `nazwa: ${v}`,
};
const diff = l => Object.keys(FIELDS).filter(k => l.old[k] !== l.new[k]).map(k => esc(FIELDS[k](l.new[k]))).join(', ');
// Rows from pokoje_log_change(): old = {} on insert, new = {} on delete.
function describe(l) {
  const add = !Object.keys(l.old).length, del = !Object.keys(l.new).length, x = del ? l.old : l.new;
  const room = id => rooms.find(r => r.id === id)?.name || id;
  if (l.tbl === 'pokoje_blocks') return `${room(x.room_id)}, ${shortDay(x.day)}: ${add ? 'zablokowany' : del ? 'odblokowany' : 'zmiana blokady'}${x.note && !del ? ' (' + x.note + ')' : ''}`;
  if (l.tbl === 'pokoje_events') return `${add ? 'Nowa' : del ? 'Usunięta' : 'Zmieniona'} impreza ${shortDay(x.day)}: ${evTitle(x)}`;
  if (l.tbl === 'pokoje_files') return `${del ? 'Usunięty' : 'Dodany'} plik: ${x.name}`;
  if (l.tbl === 'pokoje_staff') return `Zespół: ${add ? 'dodano' : del ? 'usunięto' : 'zmiana'} ${x.name || shortEmail(x.email)}${del ? '' : ' (' + ROLE_TXT[x.role] + ')'}`;
  return l.tbl;
}
const logItems = (rows, withRoom) => rows?.length
  ? rows.map(l => `<li>${l.tbl === 'pokoje_rooms' ? (withRoom ? `<b>${esc(l.new.name)}</b>: ` : '') + diff(l) : esc(describe(l))}<br><small>${esc(who(l.by))}, ${when(l.at)}</small></li>`).join('')
  : '<li class="meta">Brak zmian.</li>';

$('#histBtn').onclick = async () => {
  openId = openBlk = null;
  $('#dlgBody').innerHTML = `<h3>Ostatnie zmiany<button class="x" aria-label="Zamknij">×</button></h3><ul class="log" id="allLog"><li class="meta">Wczytuję…</li></ul>`;
  dlg.showModal();
  const { data } = await sb.from('pokoje_log').select('*').order('at', { ascending: false }).limit(100);
  $('#allLog').innerHTML = logItems(data, true);
};

// ── Team + settings ──
$('#teamBtn').onclick = () => { openId = openBlk = null; teamSheet(); dlg.showModal(); };

function teamSheet() {
  const ed = canEdit();
  $('#dlgBody').innerHTML = `
    <h3>Zespół<button class="x" aria-label="Zamknij">×</button></h3>
    <p class="meta">Admin: wszystko, także historia zmian. Edycja: zmienia pokoje, imprezy i zespół. Podgląd: tylko widzi.</p>
    <ul class="staff">${staff.map(s => `<li><b>${esc(s.name || shortEmail(s.email))}</b><br><span class="meta">${esc(shortEmail(s.email))}${isLocal(s.email) ? '' : ' · przez Google'}</span>
      ${ed && !s.locked && s.email !== me && (s.role !== 'admin' || isAdmin()) ? `<div class="acts"><select data-role="${esc(s.email)}" aria-label="Uprawnienia: ${esc(s.name || shortEmail(s.email))}">${roleOptions(s.role)}</select>
      ${isLocal(s.email) ? `<button class="btn" data-pw="${esc(s.email)}">Zmień hasło</button>` : ''}
      <button class="btn" data-del="${esc(s.email)}">Usuń</button></div>`
      : `<div class="meta">Uprawnienia: ${ROLE_TXT[s.role]}${s.locked ? ' 🔒 właściciel' : s.email === me ? ' (Ty)' : ''}</div>`}</li>`).join('')}</ul>
    ${ed ? `<form id="teamForm" class="row">
      <h4 style="margin:0 0 8px">Dodaj osobę</h4>
      <label class="f">Imię i nazwisko<input type="text" name="name" autocomplete="off"></label>
      <label class="f" style="margin-top:8px">Login albo adres Gmail<input type="text" name="login" placeholder="np. ania.k" autocapitalize="none" autocomplete="off" required></label>
      <label class="f" style="margin-top:8px">Hasło startowe, min. 8 znaków<input type="text" name="password" autocomplete="off"></label>
      <p class="meta">Podaj login i hasło. Osoba z kontem Google może zamiast loginu podać adres Gmail, wtedy hasło nie jest potrzebne.</p>
      <div style="display:flex;gap:8px"><select name="role" style="width:auto" aria-label="Uprawnienia">${roleOptions('view')}</select>
      <button class="btn pri">Dodaj</button></div></form>
    <div class="row"><label class="f">Ile mamy łóżek dostawkowych w sumie?
      <input type="number" inputmode="numeric" min="0" id="bedsTotal" value="${settings.extra_beds_total ?? ''}" placeholder="nie wiadomo"></label></div>` : ''}`;
}

// Login accounts need the service role, so they go through the edge function.
async function staffFn(body) {
  const { error } = await sb.functions.invoke('pokoje-staff', { body });
  if (!error) return true;
  const msg = await error.context?.json?.().then(j => j.error).catch(() => null);
  if (msg) ask({ title: 'Nie udało się', body: msg }); else fail('Nie udało się', error);
  return false;
}

$('#dlgBody').addEventListener('submit', async e => {
  if (e.target.id !== 'teamForm') return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const login = f.login.trim().toLowerCase(), name = f.name.trim();
  if (login.includes('@') && f.password) return ask({ title: 'Konto Google nie potrzebuje hasła', body: 'Osoba z adresem Gmail loguje się przyciskiem „Zaloguj przez Google”. Jeśli ma się logować hasłem, wpisz sam login, bez @, na przykład magda.k.' });
  if (login.includes('@')) {
    const { error } = await sb.from('pokoje_staff').insert({ email: login, name, role: f.role });
    if (error) return error.code === '23505' ? ask({ title: 'Ta osoba już jest w zespole' }) : fail('Nie dodano osoby', error);
  } else if (!await staffFn({ action: 'create', login, password: f.password, name, role: f.role })) return;
  else ask({ title: 'Konto gotowe', body: `Login: ${login}\nPrzekaż hasło osobiście.` });
  await load(); teamSheet();
});
$('#dlgBody').addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.role) {
    const { data } = await sb.from('pokoje_staff').update({ role: t.value }).eq('email', t.dataset.role).select();
    if (!data?.length) ask({ title: 'Nie zmieniono uprawnień', body: 'Tej osoby nie możesz zmieniać (na przykład admina). Odśwież listę i spróbuj ponownie.' });
  }
  if (t.id === 'bedsTotal') await sb.from('pokoje_settings').update({ extra_beds_total: t.value === '' ? null : +t.value }).eq('id', 1);
  if (t.dataset.role || t.id === 'bedsTotal') { await load(); teamSheet(); }
});
$('#dlgBody').addEventListener('click', async e => {
  const { del, pw } = e.target.dataset;
  if (pw) {
    const password = await ask({ title: `Nowe hasło: ${who(pw)}`, ok: 'Zmień hasło', cancel: 'Anuluj',
      field: { label: 'Nowe hasło, min. 8 znaków', type: 'password', autocomplete: 'new-password', min: 8 } });
    if (password && await staffFn({ action: 'password', login: pw, password }))
      ask({ title: 'Hasło zmienione', body: 'Ta osoba została wylogowana ze wszystkich urządzeń i loguje się nowym hasłem.' });
  }
  if (del && await ask({ title: `Usunąć ${who(del)} z zespołu?`, body: 'Straci dostęp od razu.', danger: true, ok: 'Usuń z zespołu', cancel: 'Anuluj' })) {
    if (isLocal(del)) await staffFn({ action: 'delete', login: del });
    else await sb.from('pokoje_staff').delete().eq('email', del);
    await load(); teamSheet();
  }
});

$('#retry').onclick = () => { netError(null); load(); };

start();
</script>
