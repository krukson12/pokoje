<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokoje</title>
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#f3f4f6; --card:#fff; --ink:#111827; --mute:#6b7280; --line:#e5e7eb;
    --free:#16a34a; --free-bg:#dcfce7; --dirty:#b45309; --dirty-bg:#fef3c7; --occ:#b91c1c; --occ-bg:#fee2e2; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  [hidden] { display:none !important; }
  button { font:inherit; cursor:pointer; }
  header { position:sticky; top:0; z-index:2; background:#1f2937; color:#fff; padding:10px 16px calc(10px);
    padding-top:max(10px, env(safe-area-inset-top)); display:flex; gap:8px; align-items:center; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button { background:#374151; color:#fff; border:0; border-radius:8px; padding:6px 10px; font-size:14px; }
  .wrap { max-width:960px; margin:0 auto; padding:12px 16px 40px; }
  #stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border-radius:10px; padding:8px; text-align:center; }
  .stat b { display:block; font-size:22px; }
  .stat small { color:var(--mute); font-size:12px; }
  #filters { display:flex; gap:6px; overflow-x:auto; margin-bottom:8px; }
  #filters button { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:6px 12px; white-space:nowrap; font-size:14px; }
  #filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  h2 { font-size:15px; color:var(--mute); margin:16px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  .tile { text-align:left; border:0; border-left:5px solid; border-radius:10px; padding:8px 10px; min-height:72px; display:flex; flex-direction:column; gap:2px; color:var(--ink); }
  .tile.free { background:var(--free-bg); border-color:var(--free); }
  .tile.dirty { background:var(--dirty-bg); border-color:var(--dirty); }
  .tile.occ { background:var(--occ-bg); border-color:var(--occ); }
  .tile b { font-size:15px; }
  .tile small { color:var(--mute); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile .ic { font-size:13px; margin-top:auto; }
  .empty { color:var(--mute); }
  dialog { border:0; border-radius:14px; padding:0; width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 32px); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .sheet { padding:16px; }
  .sheet h3 { margin:0 0 4px; font-size:20px; display:flex; align-items:center; gap:8px; }
  .sheet h3 .x { margin-left:auto; border:0; background:none; font-size:24px; line-height:1; padding:0 4px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; color:#fff; }
  .badge.free { background:var(--free); } .badge.dirty { background:var(--dirty); } .badge.occ { background:var(--occ); }
  .row { margin:12px 0; }
  label.f { display:block; font-size:13px; color:var(--mute); margin-bottom:4px; }
  input[type=text], input[type=email], input[type=number], textarea, select { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:60px; resize:vertical; }
  .big { width:100%; border:0; border-radius:10px; padding:12px; font-weight:600; color:#fff; font-size:17px; }
  .big.take { background:var(--occ); } .big.free { background:var(--free); }
  .checks { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .checks label { display:flex; gap:8px; align-items:center; background:var(--bg); border-radius:8px; padding:10px; }
  .checks input { width:20px; height:20px; }
  .stepper { display:flex; align-items:center; gap:12px; }
  .stepper button { width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:20px; }
  .stepper b { font-size:20px; min-width:20px; text-align:center; }
  .log { list-style:none; padding:0; margin:0; font-size:14px; }
  .log li { padding:6px 0; border-top:1px solid var(--line); }
  .log small { color:var(--mute); }
  .meta { font-size:13px; color:var(--mute); }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; }
  .btn.pri { background:var(--ink); color:#fff; border-color:var(--ink); }
  .staff { display:grid; grid-template-columns:1fr auto auto; gap:6px; align-items:center; font-size:14px; }
  #login { max-width:360px; margin:15vh auto; padding:24px 16px; text-align:center; }
  #login .btn { width:100%; margin-top:8px; padding:12px; }
  @media (max-width:420px) { #stats { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>

<div id="login" hidden>
  <h1>Pokoje</h1>
  <p class="meta" id="loginMsg">Zaloguj się, żeby zobaczyć stan pokoi.</p>
  <button class="btn pri" id="google">Zaloguj przez Google</button>
  <form id="mailForm" class="row">
    <input type="email" id="mail" placeholder="albo podaj e-mail" required>
    <button class="btn">Wyślij link do logowania</button>
  </form>
  <button class="btn" id="logout2" hidden>Wyloguj</button>
</div>

<div id="app" hidden>
  <header>
    <h1>Pokoje</h1>
    <button id="histBtn">Historia</button>
    <button id="teamBtn">Zespół</button>
    <button id="logout">Wyloguj</button>
  </header>
  <div class="wrap">
    <div id="stats"></div>
    <nav id="filters">
      <button data-f="all" class="on">Wszystkie</button>
      <button data-f="free">Wolne gotowe</button>
      <button data-f="dirty">Do przygotowania</button>
      <button data-f="occ">Zajęte</button>
    </nav>
    <div id="board"></div>
    <p class="meta" id="who"></p>
  </div>
</div>

<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

// Same Supabase project as FitDash/Stampd (Google login is set up there).
const sb = createClient('https://wkzaebbfhytuauioqjqw.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndremFlYmJmaHl0dWF1aW9xanF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTY2NzgsImV4cCI6MjA5NTU3MjY3OH0.DyrWDmxKqFFhr_geNapCJMlhb2lrpVhCYEQvvGzGjMw');

const CHECKS = [['cleaned', 'Posprzątany'], ['prepared', 'Przygotowany'], ['keys_out', 'Klucze wydane'], ['keys_back', 'Klucze oddane']];
const BUILDINGS = [['dworek', 'Dworek'], ['hotel', 'Hotel']];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const when = t => new Date(t).toLocaleString('pl-PL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
const dlg = $('#dlg');

let role = null, me = '', rooms = [], staff = [], settings = {}, filter = 'all', openId = null;
const canEdit = () => role === 'edit';
const who = email => staff.find(s => s.email === email)?.name || email || '?';
const state = r => r.occupied ? 'occ' : r.cleaned && r.prepared ? 'free' : 'dirty';
const STATE_TXT = { free: 'Wolny, gotowy', dirty: 'Wolny, do przygotowania', occ: 'Zajęty' };
const keysWithGuest = r => r.keys_out && !r.keys_back;

// ── Auth ──
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  me = session.user.email.toLowerCase();
  const { data } = await sb.rpc('pokoje_role');
  role = data;
  if (!role) return showLogin(`Konto ${me} nie ma dostępu. Poproś kierownika o dodanie tego adresu w zakładce Zespół.`, true);
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#who').textContent = `Zalogowano: ${me} (${canEdit() ? 'edycja' : 'tylko podgląd'})`;
  await load();
  sb.channel('pokoje').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pokoje_rooms' }, p => put(p.new)).subscribe();
  // Phones drop the websocket when asleep, so re-read on wake.
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && load());
}

function showLogin(msg, signedIn) {
  $('#app').hidden = true;
  $('#login').hidden = false;
  if (msg) $('#loginMsg').textContent = msg;
  $('#google').hidden = $('#mailForm').hidden = !!signedIn;
  $('#logout2').hidden = !signedIn;
}

$('#google').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
$('#mailForm').onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithOtp({ email: $('#mail').value.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
  $('#loginMsg').textContent = error ? 'Nie wysłano: ' + error.message : 'Sprawdź skrzynkę i kliknij link.';
};
$('#logout').onclick = $('#logout2').onclick = async () => { await sb.auth.signOut(); location.reload(); };
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !role) start(); });

// ── Data ──
async function load() {
  const [r, s, st] = await Promise.all([
    sb.from('pokoje_rooms').select('*').order('sort'),
    sb.from('pokoje_staff').select('*').order('name'),
    sb.from('pokoje_settings').select('*').maybeSingle(),
  ]);
  if (r.error) return alert('Nie wczytano pokoi: ' + r.error.message);
  rooms = r.data; staff = s.data || []; settings = st.data || {};
  render();
}

function put(row) {
  const i = rooms.findIndex(r => r.id === row.id);
  if (i >= 0) rooms[i] = row;
  render();
}

// guardFree: only succeed if nobody took the room in the meantime.
async function save(id, patch, guardFree) {
  let q = sb.from('pokoje_rooms').update(patch).eq('id', id);
  if (guardFree) q = q.eq('occupied', false);
  const { data, error } = await q.select();
  if (error) return alert('Nie zapisano: ' + error.message);
  if (!data.length) { alert(guardFree ? 'Ktoś przed chwilą zajął ten pokój.' : 'Nie zapisano.'); return load(); }
  put(data[0]);
}

// ── Board ──
function render() {
  const n = s => rooms.filter(r => state(r) === s).length;
  const beds = rooms.reduce((a, r) => a + r.extra_beds, 0);
  $('#stats').innerHTML = [
    [n('free'), 'wolne gotowe'], [n('dirty'), 'do przygotowania'], [n('occ'), 'zajęte'],
    [`${beds} / ${settings.extra_beds_total ?? '?'}`, 'dostawki w użyciu'],
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');

  const show = r => filter === 'all' || state(r) === filter;
  $('#board').innerHTML = BUILDINGS.map(([b, label]) => {
    const list = rooms.filter(r => r.building === b && show(r));
    return `<h2>${label}</h2>` + (list.length ? `<div class="grid">${list.map(tile).join('')}</div>` : '<p class="empty">Brak pokoi w tym widoku.</p>');
  }).join('');
  if (openId && dlg.open) roomSheet(openId);
}

function tile(r) {
  const s = state(r);
  const ic = [r.extra_beds ? `🛏+${r.extra_beds}` : '', keysWithGuest(r) ? '🔑' : '', r.note ? '📝' : ''].join(' ');
  return `<button class="tile ${s}" data-id="${r.id}"><b>${esc(r.name)}</b>
    <small>${r.occupied ? esc(r.guest) || 'Zajęty' : STATE_TXT[s]}</small><span class="ic">${ic}</span></button>`;
}

$('#board').onclick = e => { const t = e.target.closest('.tile'); if (t) { openId = t.dataset.id; roomSheet(openId); dlg.showModal(); } };
$('#filters').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  $('#filters').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  render();
};
dlg.onclose = () => { openId = null; };
dlg.onclick = e => { if (e.target === dlg || e.target.closest('.x')) dlg.close(); };

// ── Room sheet ──
async function roomSheet(id) {
  const r = rooms.find(x => x.id === id), s = state(r), dis = canEdit() ? '' : 'disabled';
  // Don't clobber a field someone is typing in when a live update arrives.
  if (dlg.open && dlg.contains(document.activeElement) && document.activeElement.matches('input[type=text],textarea')) return;
  $('#dlgBody').innerHTML = `
    <h3>${esc(r.name)} <span class="badge ${s}">${STATE_TXT[s]}</span><button class="x" aria-label="Zamknij">×</button></h3>
    <div class="meta">${r.updated_by ? `Ostatnia zmiana: ${esc(who(r.updated_by))}, ${when(r.updated_at)}` : ''}</div>
    ${canEdit() ? `<div class="row">${r.occupied
      ? '<button class="big free" data-act="free">Zwolnij pokój</button>'
      : '<button class="big take" data-act="take">Zajmij pokój</button>'}</div>` : ''}
    <div class="row"><label class="f">Gość / wesele</label><input type="text" data-f="guest" value="${esc(r.guest)}" ${dis} placeholder="np. wesele Kowalskich, p. Nowak"></div>
    <div class="row"><label class="f">Łóżka dostawkowe</label><div class="stepper">
      <button data-beds="-1" ${dis} aria-label="Mniej">−</button><b>${r.extra_beds}</b><button data-beds="1" ${dis} aria-label="Więcej">+</button></div></div>
    <div class="row checks">${CHECKS.map(([k, l]) => `<label><input type="checkbox" data-c="${k}" ${r[k] ? 'checked' : ''} ${dis}>${l}</label>`).join('')}</div>
    <div class="row"><label class="f">Notatka</label><textarea data-f="note" ${dis} placeholder="np. zepsuta lampka, łóżeczko dla dziecka">${esc(r.note)}</textarea></div>
    ${canEdit() ? `<div class="row"><label class="f">Nazwa pokoju</label><input type="text" data-f="name" value="${esc(r.name)}"></div>` : ''}
    <div class="row"><label class="f">Historia pokoju</label><ul class="log" id="roomLog"><li class="meta">Wczytuję…</li></ul></div>`;
  const { data } = await sb.from('pokoje_log').select('*').eq('room_id', id).order('at', { ascending: false }).limit(15);
  const el = $('#roomLog');
  if (el) el.innerHTML = logItems(data, false);
}

$('#dlgBody').addEventListener('click', e => {
  const r = rooms.find(x => x.id === openId); if (!r) return;
  const act = e.target.dataset.act, beds = e.target.dataset.beds;
  if (act === 'take') save(r.id, { occupied: true, keys_out: false, keys_back: false }, true);
  if (act === 'free' && confirm(`Zwolnić ${r.name}? Gość, dostawki i odhaczenia zostaną wyczyszczone.`))
    save(r.id, { occupied: false, guest: '', extra_beds: 0, ...Object.fromEntries(CHECKS.map(([k]) => [k, false])) });
  if (beds) {
    const v = r.extra_beds + +beds;
    if (v >= 0 && v <= 3) save(r.id, { extra_beds: v });
  }
});
$('#dlgBody').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.c) save(openId, { [t.dataset.c]: t.checked });
  if (t.dataset.f && !t.closest('#teamForm')) save(openId, { [t.dataset.f]: t.value.trim() });
});

// ── Log ──
const FIELDS = {
  occupied: v => v ? 'zajęty' : 'zwolniony',
  guest: v => `gość: ${v || 'brak'}`,
  extra_beds: v => `dostawki: ${v}`,
  ...Object.fromEntries(CHECKS.map(([k, l]) => [k, v => `${l.toLowerCase()} ${v ? '✓' : '✗'}`])),
  note: v => `notatka: ${v || 'usunięta'}`,
  name: v => `nazwa: ${v}`,
};
const diff = l => Object.keys(FIELDS).filter(k => l.old[k] !== l.new[k]).map(k => esc(FIELDS[k](l.new[k]))).join(', ');
const logItems = (rows, withRoom) => rows?.length
  ? rows.map(l => `<li>${withRoom ? `<b>${esc(l.new.name)}</b>: ` : ''}${diff(l)}<br><small>${esc(who(l.by))}, ${when(l.at)}</small></li>`).join('')
  : '<li class="meta">Brak zmian.</li>';

$('#histBtn').onclick = async () => {
  openId = null;
  $('#dlgBody').innerHTML = `<h3>Ostatnie zmiany<button class="x" aria-label="Zamknij">×</button></h3><ul class="log" id="allLog"><li class="meta">Wczytuję…</li></ul>`;
  dlg.showModal();
  const { data } = await sb.from('pokoje_log').select('*').order('at', { ascending: false }).limit(100);
  $('#allLog').innerHTML = logItems(data, true);
};

// ── Team + settings ──
$('#teamBtn').onclick = () => { openId = null; teamSheet(); dlg.showModal(); };

function teamSheet() {
  const ed = canEdit();
  $('#dlgBody').innerHTML = `
    <h3>Zespół<button class="x" aria-label="Zamknij">×</button></h3>
    <p class="meta">Edycja: zmienia stan pokoi i dodaje osoby. Podgląd: tylko widzi.</p>
    <div class="staff">${staff.map(s => `<span>${esc(s.name || s.email)}<br><small class="meta">${esc(s.email)}</small></span>
      ${ed ? `<select data-role="${esc(s.email)}"><option value="edit" ${s.role === 'edit' ? 'selected' : ''}>edycja</option><option value="view" ${s.role === 'view' ? 'selected' : ''}>podgląd</option></select>
      <button class="btn" data-del="${esc(s.email)}" ${s.email === me ? 'disabled' : ''}>Usuń</button>`
      : `<span class="meta">${s.role === 'edit' ? 'edycja' : 'podgląd'}</span><span></span>`}`).join('')}</div>
    ${ed ? `<form id="teamForm" class="row">
      <label class="f">Dodaj osobę (adres, którym loguje się do Google)</label>
      <input type="email" name="email" placeholder="e-mail" required>
      <div class="row" style="display:flex;gap:8px"><input type="text" name="name" placeholder="imię"><select name="role" style="width:auto"><option value="view">podgląd</option><option value="edit">edycja</option></select></div>
      <button class="btn pri">Dodaj</button></form>
    <div class="row"><label class="f">Ile mamy łóżek dostawkowych w sumie?</label>
      <input type="number" min="0" id="bedsTotal" value="${settings.extra_beds_total ?? ''}" placeholder="nie wiadomo"></div>` : ''}`;
}

$('#dlgBody').addEventListener('submit', async e => {
  if (e.target.id !== 'teamForm') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const { error } = await sb.from('pokoje_staff').insert({ email: f.get('email').trim().toLowerCase(), name: f.get('name').trim(), role: f.get('role') });
  if (error) return alert(error.code === '23505' ? 'Ta osoba już jest na liście.' : 'Nie dodano: ' + error.message);
  await load(); teamSheet();
});
$('#dlgBody').addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.role) await sb.from('pokoje_staff').update({ role: t.value }).eq('email', t.dataset.role);
  if (t.id === 'bedsTotal') await sb.from('pokoje_settings').update({ extra_beds_total: t.value === '' ? null : +t.value }).eq('id', 1);
  if (t.dataset.role || t.id === 'bedsTotal') { await load(); teamSheet(); }
});
$('#dlgBody').addEventListener('click', async e => {
  const email = e.target.dataset.del;
  if (email && confirm(`Usunąć ${email}?`)) { await sb.from('pokoje_staff').delete().eq('email', email); await load(); teamSheet(); }
});

start();
</script>
</body>
</html>
